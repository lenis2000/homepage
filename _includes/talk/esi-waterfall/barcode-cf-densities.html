<section class="slide slide-top" id="barcode-cf-densities" data-title="Barcode Simulator">
    <h2 class="slide-title">The Barcode, Live</h2>

    <div style="display: flex; flex-direction: column; gap: 1.5vh; margin-top: 0.5vh; height: calc(100% - 7vh); text-align: left;">
        <div style="font-size: clamp(1.2rem, 2.2vw, 1.8rem);">
            Uses the closed form of the barcode kernel <span class="cite">[Knizel&ndash;P., in preparation]</span>
        </div>

        <!-- Controls bar -->
        <div style="display: flex; align-items: center; gap: 2vw; background: #f5f5f5; border-left: 4px solid var(--slide-accent); padding: 1vh 1.5vw; font-size: clamp(1.1rem, 1.7vw, 1.45rem);">
            <label for="bcf-q" style="display: flex; align-items: center; gap: 0.8vw; flex: 1;">\(q\) <input type="range" id="bcf-q" min="0.02" max="0.95" step="any" value="0.142857" style="flex: 1; min-width: 0;"> <span id="bcf-qval" style="font-weight: bold; min-width: 4.5em; font-variant-numeric: tabular-nums;">0.1429</span></label>
            <label for="bcf-chi" style="display: flex; align-items: center; gap: 0.8vw; flex: 1;">\(\chi\) <input type="range" id="bcf-chi" min="-2.302585" max="2.995732" step="any" value="1.098612" style="flex: 1; min-width: 0;"> <span id="bcf-chival" style="font-weight: bold; min-width: 4.5em; font-variant-numeric: tabular-nums;">3.000</span></label>
            <button id="bcf-resample" type="button" style="padding: 0.6vh 1vw; border: 2px solid #232D4B; border-radius: 4px; background: #fff; color: #232D4B; font-size: clamp(0.95rem, 1.3vw, 1.2rem); cursor: pointer; white-space: nowrap;">Resample</button>
        </div>

        <canvas id="bcf-plot" style="width: 100%; height: 30vh; display: block;"></canvas>

        <canvas id="bcf-barcode" style="width: 100%; flex: 1; min-height: 0; display: block; background: #fafafa;"></canvas>
    </div>
</section>
