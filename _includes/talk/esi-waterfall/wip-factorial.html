<section class="slide slide-top" id="wip-factorial" data-title="Another Model, Live">
    <h2 class="slide-title">Another Model, Live</h2>

    <div style="display: flex; flex-direction: column; gap: 1.5vh; margin-top: 0.5vh; height: calc(100% - 7vh); text-align: left;">
        <div style="font-size: clamp(1.2rem, 2.2vw, 1.8rem);">
            Exact sampler; with Yizhen Li <span class="cite">(in preparation)</span>
        </div>

        <div id="wip-factorial-controls" style="display: flex; flex-wrap: wrap; align-items: center; gap: 0.6vw 2vw; background: #f5f5f5; border-left: 4px solid var(--slide-accent); padding: 1vh 1.5vw; font-size: clamp(1.1rem, 1.7vw, 1.45rem);">
            <span style="display: inline-flex; gap: 0.4vw;">
                <button class="wip-factorial-btn" data-group="spec" data-value="waterfall">waterfall</button>
                <button class="wip-factorial-btn" data-group="spec" data-value="schur">Schur</button>
            </span>
            <span id="wip-factorial-q-group" style="display: inline-flex; gap: 0.4vw; align-items: center;">
                <em>q</em>:
                <button class="wip-factorial-btn" data-group="q" data-value="0.8">0.8</button>
                <button class="wip-factorial-btn" data-group="q" data-value="0.9">0.9</button>
                <button class="wip-factorial-btn" data-group="q" data-value="0.95">0.95</button>
            </span>
            <span style="display: inline-flex; gap: 0.4vw; align-items: center;">
                <em>N</em>:
                <button class="wip-factorial-btn" data-group="n" data-value="20">20</button>
                <button class="wip-factorial-btn" data-group="n" data-value="40">40</button>
                <button class="wip-factorial-btn" data-group="n" data-value="80">80</button>
                <button class="wip-factorial-btn" data-group="n" data-value="160">160</button>
            </span>
            <button id="wip-factorial-sample" style="padding: 0.3em 1em; cursor: pointer; border: 2px solid var(--slide-accent); background: var(--slide-accent); color: white; border-radius: 4px; font-size: inherit; font-weight: bold;">Sample</button>
        </div>

        <canvas id="wip-factorial-canvas" width="2400" height="1100" style="width: 100%; flex: 1; min-height: 0; display: block; background: #ffffff;"></canvas>
    </div>

    <style>
        #wip-factorial .wip-factorial-btn {
            padding: 0.25em 0.7em; cursor: pointer; border: 2px solid var(--slide-navy); border-radius: 4px;
            background: #fff; color: var(--slide-navy); font-size: inherit;
        }
        #wip-factorial .wip-factorial-btn.active { background: var(--slide-navy); color: #fff; }
        #wip-factorial .wip-factorial-btn:disabled, #wip-factorial-sample:disabled { opacity: 0.5; cursor: default; }
    </style>
</section>
